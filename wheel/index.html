<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>Колесо баланса</title>
<style>
html,body{margin:0;min-height:100%;background:#0b1120;color:#aab4c3;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Arial,sans-serif}
.boot{max-width:420px;margin:20vh auto;text-align:center;padding:20px}
.boot a{color:#9db8df}
</style>
</head>
<body>
<div class="boot" id="boot">Загрузка колеса баланса…</div>
<script>
(async function () {
  var boot = document.getElementById("boot");
  try {
    var urls = ["./index-part-0.txt", "./index-part-1.txt", "./index-part-2.txt"];
    var chunks = await Promise.all(urls.map(function (u) {
      return fetch(u, { cache: "no-store" }).then(function (r) {
        if (!r.ok) throw new Error(u + " " + r.status);
        return r.text();
      });
    }));
    var html = chunks.join("");
    document.open();
    document.write(html);
    document.close();
  } catch (e) {
    boot.innerHTML = "Не удалось загрузить колесо.<br><a href=\"./hub.html\">Хаб</a> · <a href=\"./cabinet.html\">Кабинет</a><br><small>" + String(e) + "</small>";
  }
})();
</script>
</body>
</html>
