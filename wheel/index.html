<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>Колесо баланса</title>
<style>
html,body{margin:0;min-height:100%;background:#0b1120;color:#aab4c3;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Arial,sans-serif}
.boot{max-width:420px;margin:20vh auto;text-align:center;padding:20px}
.boot a{color:#9db8df}
</style>
</head>
<body>
<div class="boot" id="boot">Загрузка колеса баланса…</div>
<script>
(async function () {
  var boot = document.getElementById("boot");
  async function loadPart(url) {
    var r = await fetch(url, { cache: "no-store" });
    if (!r.ok) throw new Error(url + " " + r.status);
    var b64 = (await r.text()).trim();
    var bin = Uint8Array.from(atob(b64), function (c) { return c.charCodeAt(0); });
    if (typeof DecompressionStream === "undefined") {
      throw new Error("Нужен современный браузер (gzip)");
    }
    var ds = new DecompressionStream("gzip");
    var stream = new Response(bin).body.pipeThrough(ds);
    return await new Response(stream).text();
  }
  try {
    var chunks = await Promise.all([
      loadPart("./index-part-0.gz.b64"),
      loadPart("./index-part-1.gz.b64"),
      loadPart("./index-part-2.gz.b64")
    ]);
    document.open();
    document.write(chunks.join(""));
    document.close();
  } catch (e) {
    boot.innerHTML = "Не удалось загрузить колесо.<br><a href=\"./hub.html\">Хаб</a> · <a href=\"./cabinet.html\">Кабинет</a><br><small>" + String(e) + "</small>";
  }
})();
</script>
</body>
</html>
