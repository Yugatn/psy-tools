<!doctype html><html lang="ru"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Колесо баланса страхов</title><style>body{font-family:system-ui;background:#0b1120;color:#fff;margin:0;padding:16px}main{max-width:800px;margin:auto}.card{background:#111a2e;border:1px solid #26324a;border-radius:16px;padding:16px;margin:12px 0}input{width:100%}textarea{width:100%;min-height:80px;background:#0e1729;color:#fff;border:1px solid #33425f;border-radius:10px;padding:10px;box-sizing:border-box}h1{text-align:center}.hint{color:#aab4c3;font-size:14px;line-height:1.5}.score{font-size:36px;text-align:center;font-weight:800}</style></head><body><main><h1>Колесо баланса страхов</h1><p class="hint">Оценивайте не объективную опасность, а то, насколько страх влияет на ваши решения и действия. Цель — постепенное снижение ограничивающего влияния страха.</p><div id="app"></div></main><script>const rays=["Страх смерти","Страх неудачи","Страх успеха","Страх богатства","Страх бедности","Страх независимости","Страх свободы","Страх перемен","Страх осуждения","Страх одиночества","Страх ответственности","Страх неизвестности"];const app=document.querySelector("#app");app.innerHTML=rays.map((r,i)=>'<section class="card"><h2>'+(i+1)+". "+r+'</h2><p class="hint">Насколько этот страх влияет на ваши решения и действия сейчас?</p><div class="score" id="s'+i+'">5</div><input type="range" min="0" max="10" value="5" oninput="document.getElementById(\'s'+i+'\').textContent=this.value"><p><b>Что будет, если случится самый худший сценарий? Что будет дальше?</b></p><p class="hint">Опишите последствия, а затем следующие шаги после них.</p><textarea placeholder="Самый худший сценарий → что дальше → мои следующие действия"></textarea><p><b>Что я делаю, несмотря на этот страх?</b></p><textarea placeholder="Конкретное действие"></textarea></section>').join("")</script></body></html>
