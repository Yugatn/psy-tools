name: Repair detail wheel pages
on:
  push:
    paths:
      - '.github/workflows/repair-detail-wheels.yml'
      - 'scripts/repair-detail-wheels.py'
      - 'payloads/detail-share-calendar-block.gz.b64'
jobs:
  repair:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - name: Repair corrupted detail pages
        run: python3 scripts/repair-detail-wheels.py
      - name: Commit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add wheel/
          if git diff --cached --quiet; then
            echo "No changes"
          else
            git commit -m "fix(wheel): repair detail-* share/calendar corruption and orphan brace"
            git push
          fi
