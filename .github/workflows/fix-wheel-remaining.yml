name: Fix remaining wheel bugs
on:
  push:
    paths:
      - '.github/workflows/fix-wheel-remaining.yml'
      - 'scripts/fix-wheel-null.py'
jobs:
  fix:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - name: Apply null-safe patches
        run: python3 scripts/fix-wheel-null.py
      - name: Commit and push
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add wheel/
          if git diff --cached --quiet; then
            echo "No changes"
          else
            git commit -m "fix(wheel): null-safe p.map loadValues + cabinet wheelNested"
            git push
          fi
