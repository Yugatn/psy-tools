name: Verify cabinet nested keys

on:
  pull_request:
    paths:
      - 'wheel/cabinet.html'
      - '.github/workflows/fix-cabinet-nested.yml'
  push:
    branches: [main]
    paths:
      - 'wheel/cabinet.html'
      - '.github/workflows/fix-cabinet-nested.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Ensure cabinet discovers all wheel key families
        run: |
          grep -Fq 'wheelBalance' wheel/cabinet.html
          grep -Fq 'wheelNested' wheel/cabinet.html
          grep -Fq 'wheelBalanceDetail:' wheel/cabinet.html
          grep -Fq 'function allWheelKeys()' wheel/cabinet.html
          grep -Fq 'function discoverEntries()' wheel/cabinet.html
      - name: Check cabinet inline JavaScript parses
        run: |
          node - <<'NODE'
          const fs=require('node:fs');
          const vm=require('node:vm');
          const html=fs.readFileSync('wheel/cabinet.html','utf8');
          const scripts=[...html.matchAll(/<script(?:\s[^>]*)?>([\s\S]*?)<\/script>/gi)]
            .map(x=>x[1]).filter(Boolean);
          if(!scripts.length)throw Error('missing inline JavaScript');
          for(const script of scripts)new vm.Script(script);
          console.log('Cabinet script syntax OK');
          NODE
