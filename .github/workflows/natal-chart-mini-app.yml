name: Natal chart Mini App checks

on:
  push:
    paths:
      - "mini-apps/natal-chart/**"
      - "tests/natal-chart.test.cjs"
      - ".github/workflows/natal-chart-mini-app.yml"
  pull_request:
    paths:
      - "mini-apps/natal-chart/**"
      - "tests/natal-chart.test.cjs"
      - ".github/workflows/natal-chart-mini-app.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  regression:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: JS syntax
        run: |
          node --check mini-apps/natal-chart/chart.js
          node --check mini-apps/natal-chart/vendor/astronomy.browser.min.js
      - name: Astronomical and calculation tests
        run: node --test tests/natal-chart.test.cjs
      - name: Static app assets
        run: |
          test -f mini-apps/natal-chart/index.html
          grep -Fq 'vendor/astronomy.browser.min.js' mini-apps/natal-chart/index.html
          grep -Fq '<script src="./chart.js"></script>' mini-apps/natal-chart/index.html
