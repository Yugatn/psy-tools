<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0,
        maximum-scale=1.0, user-scalable=no"
    >

    <title>PSY-TOOLS</title>

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

    <link
        href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500;600&family=Manrope:wght@400;500;600;700&family=Unbounded:wght@400;500;600;700&display=swap"
        rel="stylesheet"
    >

    <style>

        /* =====================================================
           ROOT
        ===================================================== */

        :root {
            --bg: #02050a;
            --text: #eef7f5;
            --muted: #91a7a7;
            --accent: #45f0c3;
        }


        /* =====================================================
           RESET
        ===================================================== */

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }


        html {
            width: 100%;
            min-height: 100%;

            overflow-x: hidden;

            background: var(--bg);
        }


        body {
            width: 100%;
            min-height: 100vh;

            overflow-x: hidden;

            background:
                radial-gradient(
                    circle at 50% 10%,
                    rgba(69, 240, 195, .055),
                    transparent 30%
                ),
                radial-gradient(
                    circle at 15% 80%,
                    rgba(0, 180, 255, .035),
                    transparent 28%
                ),
                var(--bg);

            color: var(--text);

            font-family: "Manrope", sans-serif;
        }


        /* =====================================================
           BACKGROUND — NEURAL NETWORK
        ===================================================== */

        #neuralCanvas {
            position: fixed;

            inset: 0;

            width: 100%;
            height: 100%;

            z-index: 0;

            pointer-events: none;

            opacity: .48;
        }


        /* =====================================================
           MATRIX GRID BACKGROUND
        ===================================================== */

        .grid-background {
            position: fixed;

            inset: 0;

            z-index: 1;

            pointer-events: none;

            overflow: hidden;

            opacity: .17;

            background-image:
                linear-gradient(
                    rgba(69, 240, 195, .055) 1px,
                    transparent 1px
                ),
                linear-gradient(
                    90deg,
                    rgba(69, 240, 195, .055) 1px,
                    transparent 1px
                );

            background-size: 42px 42px;

            mask-image:
                linear-gradient(
                    to bottom,
                    transparent 0%,
                    black 18%,
                    black 80%,
                    transparent 100%
                );
        }


        /* =====================================================
           MAIN
        ===================================================== */

        .main {
            position: relative;

            z-index: 5;

            width: 100%;
            max-width: 1500px;

            margin-left: auto;
            margin-right: auto;

            padding:
                clamp(35px, 6vw, 75px)
                0
                110px;

            display: flex;

            flex-direction: column;

            align-items: center;
        }


        /* =====================================================
           HEADER
        ===================================================== */

        .header {
            width: 100%;

            display: flex;

            flex-direction: column;

            align-items: center;

            text-align: center;
        }


        .logo {
            font-family: "Unbounded", sans-serif;

            font-size:
                clamp(26px, 4vw, 48px);

            font-weight: 600;

            letter-spacing: .16em;

            color: var(--text);

            text-shadow:
                0 0 15px rgba(69, 240, 195, .18),
                0 0 35px rgba(69, 240, 195, .08);
        }


        .logo span {
            color: var(--accent);
        }


        .subtitle {
            margin-top: 13px;

            font-family:
                "JetBrains Mono",
                monospace;

            font-size:
                clamp(10px, 1.3vw, 13px);

            letter-spacing: .22em;

            text-transform: uppercase;

            color: var(--muted);
        }


        .header-line {
            width:
                min(650px, 72vw);

            height: 1px;

            margin-top: 28px;

            background:
                linear-gradient(
                    90deg,
                    transparent,
                    rgba(69, 240, 195, .4),
                    transparent
                );

            box-shadow:
                0 0 15px
                rgba(69, 240, 195, .08);
        }


        /* =====================================================
           SECTIONS
        ===================================================== */

        .section {
            width: 100%;

            margin-top:
                clamp(75px, 8vw, 110px);

            display: flex;

            flex-direction: column;

            align-items: center;

            text-align: center;
        }


        .section:first-of-type {
            margin-top:
                clamp(60px, 7vw, 85px);
        }


        .section-title {
            display: flex;

            flex-direction: column;

            align-items: center;

            margin-bottom: 34px;
        }


        .section-number {
            font-family:
                "JetBrains Mono",
                monospace;

            font-size: 10px;

            letter-spacing: .18em;

            color:
                rgba(69, 240, 195, .55);

            margin-bottom: 10px;
        }


        .section-title h2 {
            font-family:
                "Unbounded",
                sans-serif;

            font-size:
                clamp(16px, 2vw, 22px);

            font-weight: 500;

            letter-spacing: .03em;
        }


        .section-title::after {
            content: "";

            width: 48px;

            height: 1px;

            margin-top: 13px;

            background: var(--accent);

            opacity: .5;

            box-shadow:
                0 0 8px
                rgba(69, 240, 195, .35);
        }


        /* =====================================================
           CARDS GRID
        ===================================================== */

        .cards {
            --tile-size: 220px;
            --tile-gap: 55px;

            width: 100%;

            max-width: 100%;

            margin: 0 auto;

            display: grid;

            grid-template-columns:
                repeat(3, var(--tile-size));

            grid-auto-rows:
                var(--tile-size);

            gap: var(--tile-gap);

            justify-content: center;

            align-content: start;

            overflow: visible;
        }


        .cards:has(.card:nth-child(2)):not(
            :has(.card:nth-child(3))
        ) {
            grid-template-columns:
                repeat(2, var(--tile-size));
        }


        .cards:has(.card:nth-child(1)):not(
            :has(.card:nth-child(2))
        ) {
            grid-template-columns:
                var(--tile-size);
        }


        .cards:has(.card:nth-child(4)) {
            grid-template-columns:
                repeat(4, var(--tile-size));
        }


        /* =====================================================
           CARD
        ===================================================== */

        .card {
            position: relative;

            width: var(--tile-size);

            height: var(--tile-size);

            min-width: 0;

            text-decoration: none;

            color: var(--text);

            background:
                linear-gradient(
                    145deg,
                    rgba(10, 22, 28, .92),
                    rgba(3, 8, 12, .86)
                );

            border:
                1px solid
                rgba(69, 240, 195, .14);

            border-radius: 22px;

            display: flex;

            align-items: center;

            justify-content: center;

            text-align: center;

            isolation: isolate;

            top: 0;

            z-index: 1;

            transition:
                top .35s ease,
                border-color .35s ease,
                box-shadow .35s ease,
                background .35s ease,
                z-index 0s;
        }


        .card::before {
            content: "";

            position: absolute;

            inset: 0;

            border-radius: inherit;

            background:
                radial-gradient(
                    circle at 50% 45%,
                    rgba(69, 240, 195, .08),
                    transparent 58%
                );

            opacity: .45;

            pointer-events: none;

            z-index: -1;
        }


        .card::after {
            content: "";

            position: absolute;

            inset: 1px;

            border-radius: 21px;

            border:
                1px solid
                rgba(255,255,255,.025);

            pointer-events: none;
        }


        /* =====================================================
           CARD HOVER / ACTIVE
        ===================================================== */

        .card:hover,
        .card.active,
        .card:focus-visible {
            top: -5px;

            z-index: 1000;

            border-color:
                rgba(69, 240, 195, .48);

            background:
                linear-gradient(
                    145deg,
                    rgba(10, 26, 30, .97),
                    rgba(3, 10, 14, .94)
                );

            box-shadow:
                0 0 0 1px
                rgba(69, 240, 195, .05),

                0 15px 45px
                rgba(0, 0, 0, .35),

                0 0 28px
                rgba(69, 240, 195, .08);
        }


        .card:focus-visible {
            outline:
                2px solid
                rgba(69, 240, 195, .65);

            outline-offset: 4px;
        }


        /* =====================================================
           CARD CONTENT
        ===================================================== */

        .card-content {
            position: relative;

            z-index: 5;

            display: flex;

            flex-direction: column;

            align-items: center;

            padding: 20px;

            pointer-events: none;
        }


        /* =====================================================
           ICON
        ===================================================== */

        .icon {
            position: relative;

            width: 54px;

            height: 54px;

            margin-bottom: 16px;

            border-radius: 16px;

            border:
                1px solid
                rgba(69, 240, 195, .18);

            background:
                rgba(69, 240, 195, .035);

            color: var(--accent);

            display: flex;

            align-items: center;

            justify-content: center;

            font-size: 24px;

            overflow: hidden;

            isolation: isolate;

            box-shadow:
                inset 0 0 20px
                rgba(69, 240, 195, .025),

                0 0 20px
                rgba(69, 240, 195, .025);

            transition:
                transform .35s ease,
                border-color .35s ease,
                box-shadow .35s ease;
        }


        /* =====================================================
           MATRIX CODE INSIDE ICON
        ===================================================== */

        .icon-matrix {
            position: absolute;

            inset: -30px;

            z-index: 1;

            overflow: hidden;

            opacity: 0;

            font-family:
                "JetBrains Mono",
                monospace;

            font-size: 7px;

            line-height: 1.25;

            letter-spacing: 1px;

            word-break: break-all;

            text-align: center;

            color:
                rgba(69, 240, 195, .8);

            transform:
                rotate(0deg)
                scale(1.05);

            transition:
                opacity .4s ease;

            pointer-events: none;

            mask-image:
                radial-gradient(
                    circle,
                    black 20%,
                    rgba(0,0,0,.8) 55%,
                    transparent 75%
                );
        }


        .icon-matrix::after {
            content: "";

            position: absolute;

            inset: 0;

            background:
                radial-gradient(
                    circle at center,
                    transparent 20%,
                    rgba(2,5,10,.15) 55%,
                    rgba(2,5,10,.7) 100%
                );

            pointer-events: none;
        }


        .icon-symbol {
            position: relative;

            z-index: 3;

            transition:
                opacity .3s ease,
                transform .3s ease;
        }


        .card:hover .icon,
        .card.active .icon,
        .card:focus-visible .icon {
            transform: scale(1.07);

            border-color:
                rgba(69, 240, 195, .48);

            box-shadow:
                0 0 20px
                rgba(69, 240, 195, .12),

                inset 0 0 20px
                rgba(69, 240, 195, .05);
        }


        .card:hover .icon-matrix,
        .card.active .icon-matrix,
        .card:focus-visible .icon-matrix {
            opacity: .72;

            animation:
                matrixSpin 12s linear infinite;
        }


        .card:hover .icon-symbol,
        .card.active .icon-symbol,
        .card:focus-visible .icon-symbol {
            opacity: .85;

            transform: scale(.9);

            text-shadow:
                0 0 8px
                rgba(69, 240, 195, .8);
        }


        @keyframes matrixSpin {

            from {
                transform:
                    rotate(0deg)
                    scale(1.05);
            }

            to {
                transform:
                    rotate(360deg)
                    scale(1.05);
            }
        }


        /* =====================================================
           CARD TEXT
        ===================================================== */

        .card-title {
            font-family:
                "Manrope",
                sans-serif;

            font-size: 15px;

            line-height: 1.3;

            font-weight: 600;

            max-width: 175px;
        }


        .card-index {
            margin-top: 9px;

            font-family:
                "JetBrains Mono",
                monospace;

            font-size: 9px;

            letter-spacing: .12em;

            color:
                rgba(145, 167, 167, .55);
        }


        /* =====================================================
           DESCRIPTION POPUP
        ===================================================== */

        .description {
            position: fixed;

            left: 50%;
            top: 50%;

            width:
                min(500px, calc(100vw - 40px));

            max-width:
                calc(100vw - 40px);

            max-height:
                calc(100vh - 80px);

            padding:
                28px 32px;

            border-radius: 20px;

            border:
                1px solid
                rgba(69, 240, 195, .42);

            background:
                linear-gradient(
                    145deg,
                    rgba(3, 16, 19, .78),
                    rgba(2, 8, 12, .72)
                );

            backdrop-filter:
                blur(5px);

            -webkit-backdrop-filter:
                blur(5px);

            box-shadow:
                0 30px 90px
                rgba(0, 0, 0, .72),

                0 0 45px
                rgba(69, 240, 195, .12),

                inset 0 0 35px
                rgba(69, 240, 195, .035);

            color:
                #d6e5e3;

            font-family:
                "Manrope",
                sans-serif;

            font-size: 15px;

            line-height: 1.7;

            font-weight: 500;

            text-align: center;

            overflow: hidden;

            transform:
                translate(-50%, calc(-50% + 18px))
                scale(.94);

            opacity: 0;

            visibility: hidden;

            pointer-events: none;

            transition:
                opacity .25s ease,
                transform .25s ease,
                visibility .25s ease;

            z-index: 10000;
        }


        /* =====================================================
           MATRIX BACKGROUND INSIDE POPUP
        ===================================================== */

        .description-matrix {
            position: absolute;

            inset: -45px;

            z-index: 0;

            overflow: hidden;

            font-family:
                "JetBrains Mono",
                monospace;

            font-size: 8px;

            line-height: 1.3;

            letter-spacing: 1.5px;

            word-break: break-all;

            text-align: center;

            color:
                rgba(69, 240, 195, .20);

            opacity: .85;

            transform:
                rotate(-4deg)
                scale(1.05);

            pointer-events: none;

            mask-image:
                radial-gradient(
                    ellipse at center,
                    black 15%,
                    rgba(0,0,0,.8) 55%,
                    transparent 90%
                );

            animation:
                popupMatrixMove 18s linear infinite;
        }


        .description-matrix::after {
            content: "";

            position: absolute;

            inset: 0;

            background:
                linear-gradient(
                    180deg,
                    rgba(2,8,12,.25),
                    transparent 30%,
                    transparent 70%,
                    rgba(2,8,12,.4)
                );
        }


        @keyframes popupMatrixMove {

            0% {
                transform:
                    rotate(-4deg)
                    translate3d(0,0,0)
                    scale(1.05);
            }

            50% {
                transform:
                    rotate(-2deg)
                    translate3d(-10px,8px,0)
                    scale(1.08);
            }

            100% {
                transform:
                    rotate(-4deg)
                    translate3d(0,0,0)
                    scale(1.05);
            }
        }


        /* =====================================================
           DESCRIPTION TEXT
        ===================================================== */

        .description-text {
            position: relative;

            z-index: 2;

            display: block;

            text-shadow:
                0 1px 2px rgba(0,0,0,.9),
                0 0 12px rgba(2,8,12,.85);
        }

            content: "";

            position:
