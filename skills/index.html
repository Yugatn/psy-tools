<!DOCTYPE html>
<html lang="ru">
  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no"
    />
    <title>Карта навыков</title>
    <style>
      * {
        box-sizing: border-box;
        -webkit-tap-highlight-color: transparent;
      }
      :root {
        --bg: #0b0d12;
        --card: #151922;
        --card2: #1b202b;
        --border: rgba(255, 255, 255, 0.09);
        --text: #f3f5f7;
        --muted: #9299a6;
        --accent: #7c8cff;
        --accent2: #9c7cff;
        --good: #55d68a;
        --warning: #ffc857;
        --danger: #ff6b6b;
        --partner: #6ea8fe;
      }
      html,
      body {
        margin: 0;
        padding: 0;
        min-height: 100%;
        background: var(--bg);
        color: var(--text);
        font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Arial, sans-serif;
      }
      body {
        padding: 20px 14px 50px;
      }
      .app {
        width: 100%;
        max-width: 1180px;
        margin: 0 auto;
      }
      header {
        text-align: center;
        margin-bottom: 18px;
      }
      .logo {
        font-size: 44px;
        margin-bottom: 6px;
      }
      h1 {
        margin: 0;
        font-size: 28px;
        font-weight: 750;
      }
      .subtitle {
        margin-top: 6px;
        color: var(--muted);
        font-size: 14px;
        line-height: 1.4;
      }
      .card {
        background: var(--card);
        border: 1px solid var(--border);
        border-radius: 20px;
        padding: 16px;
        margin-bottom: 12px;
        box-shadow: 0 10px 35px rgba(0, 0, 0, 0.16);
      }
      .hidden {
        display: none !important;
      }
      .section-title {
        font-size: 19px;
        font-weight: 700;
        margin-bottom: 5px;
      }
      .section-description {
        color: var(--muted);
        font-size: 13px;
        line-height: 1.45;
        margin-bottom: 14px;
      }
      .progress-wrap {
        margin-bottom: 14px;
      }
      .progress-info {
        display: flex;
        justify-content: space-between;
        color: var(--muted);
        font-size: 12px;
        margin-bottom: 6px;
      }
      .progress {
        width: 100%;
        height: 7px;
        background: #272c37;
        border-radius: 20px;
        overflow: hidden;
      }
      .progress-bar {
        height: 100%;
        width: 0%;
        background: linear-gradient(90deg, var(--accent), var(--accent2));
        border-radius: 20px;
        transition: width 0.3s ease;
      }
      .checklist {
        display: flex;
        flex-wrap: wrap;
        gap: 6px;
        margin-bottom: 14px;
      }
      .checklist-summary {
        width: 100%;
        color: var(--muted);
        font-size: 11px;
        margin-bottom: 1px;
      }
      .checklist-item {
        display: inline-flex;
        align-items: center;
        gap: 5px;
        padding: 6px 10px;
        background: #10131a;
        border: 1px solid var(--border);
        border-radius: 10px;
        font-size: 11.5px;
        font-weight: 600;
        color: var(--muted);
        cursor: pointer;
        transition: all 0.15s ease;
        font-family: inherit;
        line-height: 1;
        max-width: 100%;
        overflow: hidden;
        text-overflow: ellipsis;
        white-space: nowrap;
      }
      .checklist-item:active {
        transform: scale(0.97);
      }
      .checklist-item .checklist-check {
        font-size: 11px;
        line-height: 1;
        opacity: 0.35;
      }
      .checklist-item.done {
        color: var(--good);
        border-color: rgba(85, 214, 138, 0.35);
        background: rgba(85, 214, 138, 0.07);
      }
      .checklist-item.done .checklist-check {
        opacity: 1;
        color: var(--good);
      }
      .checklist-item.partial {
        color: var(--accent);
        border-color: rgba(124, 140, 255, 0.3);
        background: rgba(124, 140, 255, 0.05);
      }
      .checklist-item.partial .checklist-check {
        opacity: 1;
        color: var(--accent);
      }
      .checklist-item.active {
        color: var(--text);
        border-color: var(--accent);
        background: rgba(124, 140, 255, 0.12);
        box-shadow: 0 0 0 1px rgba(124, 140, 255, 0.35) inset;
      }
      .checklist-item.active .checklist-check {
        opacity: 1;
      }
      .category-box {
        background: var(--card2);
        border: 1px solid var(--border);
        border-radius: 14px;
        padding: 10px 12px;
        margin-bottom: 14px;
      }
      .category-label {
        color: var(--muted);
        font-size: 10.5px;
        margin-bottom: 5px;
        letter-spacing: 0.4px;
      }
      select {
        width: 100%;
        appearance: none;
        background: #10131a;
        color: var(--text);
        border: 1px solid var(--border);
        border-radius: 11px;
        padding: 10px 12px;
        font-size: 14px;
        outline: none;
        font-family: inherit;
      }
      select:focus {
        border-color: var(--accent);
      }
      .category-layout {
        display: grid;
        grid-template-columns: minmax(0, 1fr) 520px;
        gap: 16px;
        align-items: start;
        margin-top: 4px;
      }
      .skills-column {
        min-width: 0;
      }
      .radar-column {
        position: sticky;
        top: 16px;
        background: var(--card2);
        border: 1px solid var(--border);
        border-radius: 16px;
        padding: 12px;
      }
      .live-radar-header {
        display: flex;
        justify-content: space-between;
        align-items: center;
        margin-bottom: 6px;
        padding: 0 4px;
      }
      .live-radar-title {
        color: var(--muted);
        font-size: 11px;
        font-weight: 700;
        text-transform: uppercase;
        letter-spacing: 0.5px;
      }
      .live-radar-percent {
        color: var(--accent);
        font-size: 20px;
        font-weight: 800;
        transition: color 0.2s ease;
      }
      .live-radar-container {
        display: flex;
        justify-content: center;
        align-items: center;
        width: 100%;
      }
      #liveSkillRadar {
        display: block;
        max-width: 100%;
        height: auto;
      }
      .skill {
        background: #10131a;
        border: 1px solid var(--border);
        border-radius: 12px;
        padding: 9px 12px 8px;
        margin-bottom: 6px;
        transition: border-color 0.2s ease, box-shadow 0.2s ease;
      }
      .skill:focus-within {
        border-color: rgba(124, 140, 255, 0.35);
      }
      .skill.verified {
        border-color: rgba(85, 214, 138, 0.35);
        box-shadow: 0 0 0 1px rgba(85, 214, 138, 0.1) inset;
      }
      .skill.unverified {
        border-color: rgba(255, 200, 87, 0.3);
      }
      .skill.has-reflection {
        border-color: rgba(255, 200, 87, 0.35);
        box-shadow: 0 0 0 1px rgba(255, 200, 87, 0.08) inset;
      }
      .skill-name-row {
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 8px;
        margin-bottom: 6px;
      }
      .skill-name {
        font-size: 13px;
        font-weight: 600;
        line-height: 1.3;
        color: var(--text);
        flex: 1;
        min-width: 0;
      }
      .skill-badge {
        display: inline-flex;
        align-items: center;
        gap: 3px;
        padding: 3px 7px;
        border-radius: 6px;
        font-size: 9.5px;
        font-weight: 800;
        letter-spacing: 0.4px;
        text-transform: uppercase;
        flex-shrink: 0;
        white-space: nowrap;
      }
      .skill-badge.verified {
        background: rgba(85, 214, 138, 0.15);
        color: var(--good);
        border: 1px solid rgba(85, 214, 138, 0.4);
      }
      .skill-badge.unverified {
        background: rgba(255, 200, 87, 0.13);
        color: var(--warning);
        border: 1px solid rgba(255, 200, 87, 0.35);
      }
      .skill-badge.reflection {
        background: rgba(255, 200, 87, 0.15);
        color: var(--warning);
        border: 1px solid rgba(255, 200, 87, 0.4);
      }
      .segmented {
        display: grid;
        grid-template-columns: repeat(5, 1fr);
        gap: 3px;
        background: #0b0d12;
        padding: 3px;
        border-radius: 10px;
        border: 1px solid var(--border);
        max-width: 280px;
      }
      .segmented button {
        padding: 8px 0;
        border-radius: 7px;
        background: transparent;
        color: var(--muted);
        font-weight: 700;
        font-size: 13px;
        font-family: inherit;
        cursor: pointer;
        border: none;
        line-height: 1;
        transition: background 0.15s ease, color 0.15s ease, transform 0.1s ease;
      }
      .segmented button:hover:not(.active) {
        background: rgba(255, 255, 255, 0.05);
        color: var(--text);
      }
      .segmented button:active {
        transform: scale(0.94);
      }
      .segmented button.active {
        box-shadow: 0 3px 10px rgba(0, 0, 0, 0.3);
        color: #fff;
      }
      .segmented button[data-value="1"].active {
        background: var(--danger);
        color: #2a0a0a;
      }
      .segmented button[data-value="2"].active {
        background: var(--warning);
        color: #3a2a08;
      }
      .segmented button[data-value="3"].active {
        background: var(--accent);
        color: #fff;
      }
      .segmented button[data-value="4"].active {
        background: var(--good);
        color: #08130d;
      }
      .segmented button[data-value="5"].active {
        background: #4be08a;
        color: #08130d;
      }
      .skill-level-hint {
        font-size: 10.5px;
        font-weight: 700;
        margin-top: 5px;
        letter-spacing: 0.3px;
        color: var(--muted);
        transition: color 0.2s ease;
        display: inline-block;
      }
      .skill-level-hint.lv-1 {
        color: var(--danger);
      }
      .skill-level-hint.lv-2 {
        color: var(--warning);
      }
      .skill-level-hint.lv-3 {
        color: var(--accent);
      }
      .skill-level-hint.lv-4 {
        color: var(--good);
      }
      .skill-level-hint.lv-5 {
        color: #4be08a;
      }
      .verification-block {
        margin-top: 10px;
        padding: 10px 12px;
        background: rgba(124, 140, 255, 0.05);
        border: 1px solid rgba(124, 140, 255, 0.18);
        border-radius: 10px;
        animation: vSlideDown 0.22s ease-out;
      }
      @keyframes vSlideDown {
        from {
          opacity: 0;
          transform: translateY(-4px);
        }
        to {
          opacity: 1;
          transform: translateY(0);
        }
      }
      .verification-title {
        display: flex;
        align-items: center;
        gap: 5px;
        font-size: 10.5px;
        font-weight: 800;
        color: var(--accent);
        letter-spacing: 0.5
