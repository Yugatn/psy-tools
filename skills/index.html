        }

        body {
            margin: 0;
            min-height: 100vh;
            background: #101218;
            color: #ffffff;
            font-family: Arial, sans-serif;
        }

        .container {
            width: min(760px, 94%);

            padding: 25px 0 50px;
        }

        h1 {
            margin: 0 0 8px;
            font-size: 32px;
        }

        .subtitle {
            color: #aeb4c0;
            line-height: 1.5;
            margin-bottom: 25px;
        }

        .panel {
            background: #191d26;
            border: 1px solid #2c3240;
            border-radius: 20px;
            padding: 20px;
            margin-bottom: 18px;
        }

        label {
            display: block;
            color: #aeb4c0;
            font-size: 14px;
            margin-bottom: 8px;
        }

        select {
            width: 100%;
            padding: 14px;
            border-radius: 12px;
            border: 1px solid #363d4c;
            background: #202530;
            color: white;
            font-size: 16px;
            outline: none;
        }

        .category-title {
            margin: 5px 0 20px;
            font-size: 24px;
        }

        .skill {
            padding: 17px 0;
            border-bottom: 1px solid #2c3240;
        }

        .skill:last-child {
            border-bottom: none;
        }

        .skill-name {
            font-size: 17px;
            font-weight: bold;
            margin-bottom: 5px;
        }

        .skill-description {
            color: #8f97a6;
            font-size: 13px;
            line-height: 1.4;
            margin-bottom: 13px;
        }

        .range-row {
            display: grid;
            grid-template-columns: 1fr 48px;
            gap: 12px;
            align-items: center;
        }

        input[type="range"] {
            width: 100%;
            accent-color: white;
            cursor: pointer;
        }

        .value {
            background: #202530;
            border: 1px solid #363d4c;
            border-radius: 10px;
            padding: 8px;
            text-align: center;
            font-weight: bold;
        }

        .scale {
            display: flex;
            justify-content: space-between;
            color: #737b8b;
            font-size: 11px;
            margin-top: 5px;
        }

        .buttons {
            display: flex;
            gap: 10px;
            flex-wrap: wrap;
        }

        button {
            border: none;
            border-radius: 12px;
            padding: 13px 18px;
            font-weight: bold;
            cursor: pointer;
        }

        .primary {
            background: white;
            color: #101218;
        }

        .secondary {
            background: #202530;
            color: white;
            border: 1px solid #363d4c;
        }

        .danger {
            background: #2a2023;
            color: #ffb5bd;
            border: 1px solid #52333a;
        }

        .progress {
            color: #8f97a6;
            font-size: 13px;
            margin-bottom: 15px;
        }

        .result {
            display: none;
        }

        .result.show {
            display: block;
        }

        .result-item {
            display: flex;
            justify-content: space-between;
            gap: 15px;
            padding: 12px 0;
            border-bottom: 1px solid #2c3240;
        }

        .result-item:last-child {
            border-bottom: none;
        }

        .result-score {
            font-weight: bold;
            white-space: nowrap;
        }

        .category-result {
            margin-bottom: 22px;
        }

        .category-result h3 {
            margin: 0 0 10px;
        }

        .average {
            color: #aeb4c0;
            font-size: 14px;
            margin-bottom: 10px;
        }

        .empty {
            color: #8f97a6;
            text-align: center;
            padding: 20px 0;
        }

        .footer {
            color: #737b8b;
            font-size: 12px;
            line-height: 1.5;
            margin-top: 25px;
        }

            .container {
                width: 94%;
                padding-top: 20px;
            }

            }

            .panel {

                border-radius: 16px;

</div>

const STORAGE_KEY = "psyToolsSkillsCompactV1";

let state = loadState();

let currentCategory = "";


/* =====================================================
   ЭЛЕМЕНТЫ
   ===================================================== */

const categorySelect =
    document.getElementById("categorySelect");

const skillsPanel =
    document.getElementById("skillsPanel");

const categoryTitle =
    document.getElementById("categoryTitle");

const skillsContainer =
    document.getElementById("skillsContainer");

const progress =
    document.getElementById("progress");

const resultPanel =
    document.getElementById("resultPanel");

const resultContainer =
    document.getElementById("resultContainer");


/* =====================================================
   ЗАПОЛНЯЕМ КАТЕГОРИИ
   ===================================================== */

Object.keys(skillCategories).forEach(category => {

    const option =
        document.createElement("option");

    option.value = category;
    option.textContent = category;

    categorySelect.appendChild(option);

});


/* =====================================================
   НАЧАЛЬНОЕ СОСТОЯНИЕ
   ===================================================== */

function loadState() {

    try {

        const saved =
            localStorage.getItem(STORAGE_KEY);

        if (saved) {
            return JSON.parse(saved);
        }

    } catch (error) {

        console.log(error);

    }

    return {
        values: {},
        completedCategories: []
    };

}


function saveState() {

    localStorage.setItem(
        STORAGE_KEY,
        JSON.stringify(state)
    );

}


/* =====================================================
   ВЫБОР КАТЕГОРИИ
   ===================================================== */

categorySelect.addEventListener(
    "change",
    () => {

        const category =
            categorySelect.value;

        if (!category) {

            skillsPanel.style.display =
                "none";

            return;

        }

        openCategory(category);

    }
);


/* =====================================================
   ОТКРЫТИЕ КАТЕГОРИИ
   ===================================================== */

function openCategory(category) {

    currentCategory = category;

    categoryTitle.textContent =
        category;

    skillsPanel.style.display =
        "block";

    renderSkills();

    updateProgress();

    window.scrollTo({
        top: 0,
        behavior: "smooth"
    });

}


/* =====================================================
   ОТРИСОВКА НАВЫКОВ
   ===================================================== */

function renderSkills() {

    skillsContainer.innerHTML = "";

    const list =
        skillCategories[currentCategory];


    list.forEach((skill, index) => {

        const key =
            createKey(
                currentCategory,
                skill.name
            );


        const value =
            state.values[key] || 1;


        const div =
            document.createElement("div");

        div.className =
            "skill";


        div.innerHTML = `

            <div class="skill-name">
                ${skill.name}
            </div>

            <div class="skill-description">
                ${skill.description}
            </div>

            <div class="range-row">

                <input
                    type="range"
                    min="1"
                    max="5"
                    step="1"
                    value="${value}"
                    data-key="${key}"
                >

                <div
                    class="value"
                    id="value-${index}">
                    ${value}
                </div>

            </div>

            <div class="scale">

                <span>1 — нет опыта</span>

                <span>2</span>

                <span>3</span>

                <span>4</span>

                <span>5 — профессионал</span>

            </div>

        `;


        skillsContainer.appendChild(div);


        const slider =
            div.querySelector("input");


        slider.addEventListener(
            "input",
            event => {

                const value =
                    Number(event.target.value);

                state.values[key] =
                    value;

                div
                    .querySelector(".value")
                    .textContent =
                    value;

                saveState();

            }
        );

    });

}


/* =====================================================
   СОЗДАНИЕ КЛЮЧА
   ===================================================== */

function createKey(
    category,
    skill
) {

    return category +
        "::" +
        skill;

}


/* =====================================================
   ПРОГРЕСС
   ===================================================== */

function updateProgress() {

    const completed =
        state.completedCategories.length;

    const total =
        Object.keys(skillCategories).length;


    progress.textContent =
        `Категорий пройдено: ${completed} из ${total}`;

}


/* =====================================================
   СОХРАНИТЬ КАТЕГОРИЮ
   ===================================================== */

document
    .getElementById("nextBtn")
    .addEventListener(
        "click",
        () => {

            if (
                !state.completedCategories.includes(
                    currentCategory
                )
            ) {

                state.completedCategories.push(
                    currentCategory
                );

            }


            saveState();

            updateProgress();

            categorySelect.value = "";

            skillsPanel.style.display =
                "none";


            const next =
                findNextCategory();


            if (next) {

                categorySelect.value =
                    next;

                openCategory(next);

            } else {

                showResults();

            }

        }
    );


/* =====================================================
   СЛЕДУЮЩАЯ КАТЕГОРИЯ
   ===================================================== */

function findNextCategory() {

    return Object.keys(skillCategories)
        .find(
            category =>
                !state.completedCategories
                    .includes(category)
        );

}


/* =====================================================
   ВЫБРАТЬ ДРУГУЮ
   ===================================================== */

document
    .getElementById("backBtn")
    .addEventListener(
        "click",
        () => {

            skillsPanel.style.display =
                "none";

            categorySelect.value = "";

        }
    );


/* =====================================================
   РЕЗУЛЬТАТ
   ===================================================== */

function showResults() {

    resultPanel.classList.add("show");

    resultContainer.innerHTML = "";


    const categories =
        Object.keys(skillCategories);


    categories.forEach(category => {

        const list =
            skillCategories[category];


        const evaluated =
            list.map(skill => {

                const key =
                    createKey(
                        category,
                        skill.name
                    );

                return {
                    ...skill,
                    value:
                        state.values[key] || 1
                };

            });


        const average =
            evaluated.reduce(
                (sum, skill) =>
                    sum + skill.value,
                0
            ) / evaluated.length;


        const box =
            document.createElement("div");

        box.className =
            "category-result";


        box.innerHTML = `

            <h3>
                ${category}
            </h3>

            <div class="average">
                Средний уровень:
                ${average.toFixed(1)} / 5
            </div>

        `;


        evaluated
            .sort(
                (a, b) =>
                    b.value - a.value
            )
            .forEach(skill => {

                const item =
                    document.createElement("div");

                item.className =
                    "result-item";


                item.innerHTML = `

                    <span>
                        ${skill.name}
                    </span>

                    <span class="result-score">
                        ${skill.value} / 5
                    </span>

                `;


                box.appendChild(item);

            });


        resultContainer.appendChild(box);

    });


    resultPanel.scrollIntoView({
        behavior: "smooth"
    });

}


/* =====================================================
   ИЗМЕНИТЬ ОЦЕНКИ
   ===================================================== */

document
    .getElementById("restartBtn")
    .addEventListener(
        "click",
        () => {

            resultPanel.classList.remove(
                "show"
            );

            categorySelect.value = "";

            skillsPanel.style.display =
                "none";

            window.scrollTo({
                top: 0,
                behavior: "smooth"
            });

        }
    );


/* =====================================================
   СОХРАНЕНИЕ
   ===================================================== */

document
    .getElementById("saveBtn")
    .addEventListener(
        "click",
        () => {

            saveState();

            alert(
                "Карта навыков сохранена."
            );

        }
    );


/* =====================================================
   ЭКСПОРТ
   ===================================================== */

document
    .getElementById("exportBtn")
    .addEventListener(
        "click",
        () => {

            const data = {

                version: 1,

                createdAt:
                    new Date().toISOString(),

                data: state

            };


            const blob =
                new Blob(
                    [
                        JSON.stringify(
                            data,
                            null,
                            2
                        )
                    ],
                    {
                        type:
                            "application/json"
                    }
                );


            const url =
                URL.createObjectURL(blob);


            const link =
                document.createElement("a");

            link.href = url;

            link.download =
                "my-skills-map.json";

            link.click();

            URL.revokeObjectURL(url);

        }
    );


/* =====================================================
   СБРОС
   ===================================================== */

document
    .getElementById("resetBtn")
    .addEventListener(
        "click",
        () => {

            const confirmed =
                confirm(
                    "Удалить все оценки навыков?"
                );


            if (!confirmed) {
                return;
            }


            state = {
                values: {},
                completedCategories: []
            };


            saveState();

            resultPanel.classList.remove(
                "show"
            );

            skillsPanel.style.display =
                "none";

            categorySelect.value = "";

            alert(
                "Карта навыков сброшена."
            );

        }
    );


/* =====================================================
   TELEGRAM WEB APP
   ===================================================== */

if (
    window.Telegram &&
    window.Telegram.WebApp
) {

    try {

        window.Telegram.WebApp.ready();

        window.Telegram.WebApp.expand();

    } catch (error) {

        console.log(error);

    }

}

</script>

</body>
